name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.85.1
          components: clippy, rustfmt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes elfutils libdbus-1-dev libgtk-4-dev pkg-config

      - name: Run Rust quality checks
        run: scripts/check-rust.sh

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes flatpak

      - name: Configure Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub org.flatpak.Builder

      - name: Build and verify the tagged release bundle
        env:
          LANGUX_RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/build-flatpak.sh

      - name: Upload release assets for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: langux-release-assets
          path: |
            dist/*.flatpak
            dist/*.flatpak.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: langux-release-assets
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(release-assets/*.flatpak)
          checksums=(release-assets/*.flatpak.sha256)
          if [[ ${#bundles[@]} -ne 1 || ${#checksums[@]} -ne 1 ]]; then
            echo "error: expected one Flatpak bundle and one checksum" >&2
            exit 1
          fi
          (cd release-assets && sha256sum --check "${checksums[0]##*/}")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/*.flatpak release-assets/*.flatpak.sha256 \
            --verify-tag --generate-notes --title "$TAG_NAME"
