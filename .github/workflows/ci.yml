name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.85.1
          components: clippy, rustfmt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes elfutils libdbus-1-dev libgtk-4-dev pkg-config

      - name: Run Rust quality checks
        run: scripts/check-rust.sh

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes flatpak

      - name: Configure Flathub
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub org.flatpak.Builder

      - name: Build and verify the standalone release bundle
        run: scripts/build-flatpak.sh
