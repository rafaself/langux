[workspace]
members = [".", "crates/langux-core", "crates/langux-secret-service"]
resolver = "3"

[package]
name = "langux"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A local-first quick translator for Linux desktops"
license = "GPL-3.0-or-later"

[dependencies]
langux-core = { path = "crates/langux-core" }
langux-secret-service = { path = "crates/langux-secret-service" }
gtk = { package = "gtk4", version = "0.10.3" }
