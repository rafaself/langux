[package]
name = "langux-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Platform-independent domain types for Langux"
license = "GPL-3.0-or-later"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }

[lib]
path = "src/lib.rs"
